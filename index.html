<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ductruongvu23 Repo</title>
<link rel="icon" href="CydiaIcon.png">
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --line:#d1d1d6; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989d; --line:#38383a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:32px 16px; text-align:center; }
  img.icon { width:88px; height:88px; border-radius:20px; }
  h1 { font-size:24px; margin:12px 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  .url { display:flex; gap:8px; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:10px 12px; margin-bottom:20px; align-items:center; }
  .url code { flex:1; text-align:left; overflow-wrap:anywhere; font-size:14px; }
  .url button { border:0; background:none; color:var(--accent); font:inherit; cursor:pointer; padding:4px; }
  .btns { display:grid; gap:10px; }
  .btns a { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:14px; color:var(--accent); font-weight:600; text-decoration:none; }
  .btns a:active { opacity:.6; }
  .note { font-size:13px; margin-top:20px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="CydiaIcon.png" alt="">
  <h1>ductruongvu23 Repo</h1>
  <p>Tap your package manager to add this source.</p>

  <div class="url">
    <code id="url"></code>
    <button type="button" id="copy">Copy</button>
  </div>

  <div class="btns">
    <a id="sileo">Add to Sileo</a>
    <a id="zebra">Add to Zebra</a>
    <a id="cydia">Add to Cydia</a>
    <a id="installer">Add to Installer</a>
  </div>

  <p class="note">Open this page on your iPhone or iPad with the package manager installed.</p>
</main>
<script>
  const repo = location.origin + location.pathname.replace(/[^/]*$/, '');
  const links = {
    sileo: 'sileo://source/' + repo,
    zebra: 'zbra://sources/add/' + repo,
    cydia: 'cydia://url/https://cydia.saurik.com/api/share#?source=' + repo,
    installer: 'installer://add/repo=' + repo,
  };
  document.getElementById('url').textContent = repo;
  for (const [id, href] of Object.entries(links)) document.getElementById(id).href = href;
  document.getElementById('copy').onclick = async (e) => {
    try { await navigator.clipboard.writeText(repo); e.target.textContent = 'Copied'; } catch {}
  };
  // README buttons link to index.html#sileo etc.: jump straight into that app
  const target = links[location.hash.slice(1)];
  if (target) location.href = target;
</script>
</body>
</html>
