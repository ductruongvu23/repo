name: Publish repo

# Drop .deb files into debs/ and push: this rebuilds the APT index and deploys it to GitHub Pages.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APT index
        run: |
          # retries: runner DNS hiccups otherwise fail the whole publish
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 dpkg-dev apt-utils
          mkdir -p site
          cp -r debs icons CydiaIcon.png index.html site/
          touch site/.nojekyll
          # icons/<package-id>.png becomes that package's Icon in Sileo/Zebra, no .deb rebuild needed
          BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          for icon in icons/*.png; do
            [ -e "$icon" ] && echo "$(basename "$icon" .png) Icon $BASE/$icon"
          done > icons.override
          cd site
          dpkg-scanpackages -m -e ../icons.override debs /dev/null > Packages
          gzip -k9 Packages
          bzip2 -k9 Packages
          xz -k9 Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ductruongvu23 Repo" \
            -o APT::FTPArchive::Release::Label="ductruongvu23 Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64 iphoneos-arm" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Tweaks by ductruongvu23" \
            release . > ../Release
          mv ../Release Release
          echo "== Packages =="; cat Packages
          echo "== Release ==";  cat Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
